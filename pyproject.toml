[project]
name = "shadowstack"
version = "0.1.0"
description = "Gemelo digital para infraestructura cloud en AWS con agente de IA para simulación segura de cambios y análisis predictivo de riesgos"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Enrique González Suárez" },
    { name = "Sergio Andrés Otero Herrera" },
]

dependencies = [
    "typer[all]>=0.12.0",
    "boto3>=1.34.0",
    "botocore>=1.34.0",
    "langgraph>=0.2.0",
    "langchain-core>=0.3.0",
    "langchain-anthropic>=0.2.0",
    "pydantic>=2.7.0",
    "python-dotenv>=1.0.0",
    "rich>=13.7.0",
    "python-hcl2>=4.3.0",
    "requests>=2.31.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "pytest-mock>=3.14.0",
    "moto[all]>=5.0.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
]

[project.scripts]
shadowstack = "shadowstack.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["shadowstack"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
